<!-- ══════════════════════════════════════════════════════════ -->
<!-- REDIRECT NOTICE — paste inside <head>, right after <title>, -->
<!-- AND paste the second block right after <body>.             -->
<!-- Uses your own terminal/.dot/.t-val styling, no new look.   -->
<!-- ══════════════════════════════════════════════════════════ -->

<!-- 1) PUT THIS IN <head> — guarantees the redirect fires even if -->
<!--    JS is blocked or delayed by a sandboxed preview.           -->
<meta http-equiv="refresh" content="3;url=https://anscomqs.github.io/">


<!-- 2) PUT THIS RIGHT AFTER <body> -->
<style>
#redirectOverlay {
  position:fixed; inset:0; z-index:99999;
  display:flex; align-items:center; justify-content:center;
  background:#000;
  opacity:1; transition:opacity 0.35s ease;
}
#redirectOverlay.hide { opacity:0; pointer-events:none; }
.redirect-term {
  width:min(460px,88vw);
  background:#0d0d0d; border:1px solid rgba(255,255,255,0.12);
  border-radius:12px; overflow:hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7);
}
.redirect-term-bar {
  padding:11px 16px; border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; gap:7px; background:#111;
}
.redirect-term-bar .dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
.redirect-term-bar .dot-r{background:#ff5f57;} .redirect-term-bar .dot-y{background:#ffbd2e;} .redirect-term-bar .dot-g{background:#28c840;}
.redirect-term-title {
  font-size:12px; color:rgba(255,255,255,0.28);
  margin-left:6px; font-family:'DM Mono',monospace; flex:1;
}
.redirect-term-body {
  padding:20px 22px 24px;
  font-family:'DM Mono',monospace; font-size:13px; line-height:1.85;
  min-height:110px;
}
.redirect-term-body span { display:block; }
.rt-p   { color:#4ade80; }
.rt-hdr { color:rgba(255,255,255,0.35); }
.rt-val { color:#4ade80; }
.rt-cyn { color:#22d3ee; }
.rt-cursor::after {
  content:'█'; margin-left:2px; color:#4ade80;
  animation:rt-blink 0.9s step-end infinite;
}
@keyframes rt-blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>

<div id="redirectOverlay">
  <div class="redirect-term">
    <div class="redirect-term-bar">
      <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
      <span class="redirect-term-title">redirect.sh</span>
    </div>
    <div class="redirect-term-body" id="rt-body"></div>
  </div>
</div>

<script>
(function(){
  var DEST = "https://anscomqs.github.io/";
  var body = document.getElementById('rt-body');

  function line(html){
    var s = document.createElement('span');
    s.innerHTML = html;
    body.appendChild(s);
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function run(){
    line('<span class="rt-p">&gt;&gt;&gt; </span>resolving latest deployment<span class="rt-cursor"></span>');
    await sleep(500);
    body.lastChild.classList.remove('rt-cursor');
    line('<span class="rt-hdr">found: anscomqs.github.io</span>');
    await sleep(400);
    line('<span class="rt-p">&gt;&gt;&gt; </span><span class="rt-val">redirecting now...</span>');
    await sleep(700);
    window.location.href = DEST;
  }
  run();
})();
</script>
