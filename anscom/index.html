<!-- <div class="page">. Uses the same fonts/colors as the      -->
<!-- rest of the page, so no extra CSS variables are needed.    -->
<!-- ══════════════════════════════════════════════════════════ -->
<style>
#redirectOverlay {
  position:fixed; inset:0; z-index:99999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.82);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  opacity:1; transition:opacity 0.4s ease;
  font-family: -apple-system, 'SF Pro Display', sans-serif;
}
#redirectOverlay.hide { opacity:0; pointer-events:none; }
.redirect-card {
  background:#0d0d0d; border:1px solid rgba(255,255,255,0.12);
  border-radius:16px; padding:36px 40px; width:min(380px,88vw);
  text-align:center;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 24px 80px rgba(0,0,0,0.7);
  transform:translateY(8px) scale(0.97); opacity:0;
  transition:transform 0.45s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease;
}
#redirectOverlay.show .redirect-card { transform:translateY(0) scale(1); opacity:1; }
.redirect-spinner {
  width:34px; height:34px; margin:0 auto 20px;
  border:2.5px solid rgba(255,255,255,0.1);
  border-top-color:#4ade80; border-radius:50%;
  animation:redirect-spin 0.8s linear infinite;
}
@keyframes redirect-spin { to { transform:rotate(360deg); } }
.redirect-title {
  font-size:16px; font-weight:600; color:#fff;
  letter-spacing:-0.01em; margin-bottom:8px;
}
.redirect-sub {
  font-size:13px; color:rgba(255,255,255,0.5); line-height:1.6; margin-bottom:20px;
}
.redirect-link {
  font-family:'DM Mono',monospace; font-size:11.5px;
  color:rgba(255,255,255,0.35); text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,0.15);
  transition:color 0.15s;
}
.redirect-link:hover { color:rgba(255,255,255,0.7); }
</style>

<div id="redirectOverlay">
  <div class="redirect-card">
    <div class="redirect-spinner"></div>
    <div class="redirect-title">Taking you to the latest site</div>
    <div class="redirect-sub">Thank you for your patience.</div>
    <a class="redirect-link" href="https://anscomqs.github.io/anscom/">Click here if you're not redirected</a>
  </div>
</div>

<script>
(function(){
  var DEST = "https://anscomqs.github.io/anscom/";
  var DELAY_MS = 2200; // how long the popup stays before redirecting

  var overlay = document.getElementById('redirectOverlay');
  requestAnimationFrame(function(){ overlay.classList.add('show'); });

  setTimeout(function(){
    window.location.href = DEST;
  }, DELAY_MS);
})();
</script>
